name: EasyLinux CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck

      - name: Check Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Validate catalog application sources
        run: |
          set -Eeuo pipefail
          for catalog_file in config/catalogs/*.conf; do
            CATALOG_APPS=()
            # shellcheck disable=SC1090
            source "$catalog_file"
            for descriptor in "${CATALOG_APPS[@]}"; do
              case "$descriptor" in
                apt\|*\|*|flatpak\|*\|*) ;;
                *)
                  echo "Invalid application descriptor in $catalog_file: $descriptor" >&2
                  exit 1
                  ;;
              esac
            done
          done

      - name: Run ShellCheck
        run: shellcheck --severity=error install.sh functions/*.sh modules/*.sh tools/*.sh

      - name: Build single-file installer
        run: bash tools/build-single-file.sh

      - name: Verify generated installer
        run: test -x dist/EasyLinux && ./dist/EasyLinux --help

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: easylinux-single-file
          path: dist/EasyLinux
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release installer
        run: bash tools/build-single-file.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/EasyLinux --generate-notes --title "EasyLinux $GITHUB_REF_NAME"
